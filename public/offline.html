<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Campus Connect — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #121212;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
        text-align: center;
        padding-top: calc(1.5rem + env(safe-area-inset-top));
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
      }
      .card {
        max-width: 360px;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        border-radius: 18px;
        background: linear-gradient(135deg, #00e5ff, #7b61ff);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 22px;
        color: #111;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.9rem;
        color: #9ca3af;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      button {
        background: #00e5ff;
        color: #111;
        border: none;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">CC</div>
      <h1>You're offline</h1>
      <p>Campus Connect can't reach the server right now. Check your connection — anything you already loaded is still available.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
